# CATATAN: pnpm hanya membaca `pnpm-workspace.yaml` (bukan `.yml`).
# Lihat https://pnpm.io/workspaces — "only pnpm-workspace.yaml is read".
packages:
  - 'apps/*'
  - 'packages/*'

# Sejak pnpm 10, postinstall script milik dependency diblokir secara default.
# esbuild (dipakai Vite & tsup) perlu diizinkan agar binary-nya siap dipakai.
onlyBuiltDependencies:
  - esbuild

# Satu sumber kebenaran untuk versi dependency.
# Package cukup menulis `"zod": "catalog:"` di package.json masing-masing.
catalog:
  '@biomejs/biome': ^2.5.14
  '@fastify/cors': ^11.3.0
  '@fastify/swagger': ^9.9.0
  '@fastify/swagger-ui': ^6.1.1
  '@fastify/type-provider-zod': ^1.0.0
  '@hookform/resolvers': ^5.9.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.0
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.4.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  fastify: ^5.12.5
  fastify-plugin: ^6.0.0
  lucide-react: ^1.48.0
  openapi-types: ^12.1.3
  postgres: ^3.4.9
  radix-ui: ^1.6.7
  react: ^19.3.0
  react-dom: ^19.3.0
  react-hook-form: ^7.89.0
  react-router: ^7.18.4
  shiki: ^4.4.3
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  tsx: ^4.23.15
  turbo: ^2.11.5
  tw-animate-css: ^1.4.0
  typescript: ~5.9.3
  vite: ^8.3.1
  zod: ^4.6.5

allowBuilds:
  esbuild: true
