services:
  postgres:
    # pgvector image: PostgreSQL 16 + vector extension, siap dipakai
    # untuk AI embedding di masa depan.
    image: pgvector/pgvector:pg16
    container_name: snippets-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-snippets_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-snippets_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
